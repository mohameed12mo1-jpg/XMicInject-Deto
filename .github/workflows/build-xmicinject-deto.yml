name: Build XMicInject-Deto

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clone clean upstream
        run: git clone --depth 1 --branch master https://github.com/n00b-labs/XMicInject.git upstream

      - name: Apply Deto baseline
        run: |
          python3 tools/prepare_deto.py upstream
          cp patches/IpcClient.kt upstream/app/src/main/java/com/xmicinject/IpcClient.kt
          cp patches/XMicHook.kt upstream/app/src/main/java/com/xmicinject/XMicHook.kt

      - name: Build APK
        working-directory: upstream
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          test -f upstream/app/build/outputs/apk/debug/app-debug.apk
          cp upstream/app/build/outputs/apk/debug/app-debug.apk XMicInject-Deto-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XMicInject-Deto-debug
          path: XMicInject-Deto-debug.apk
          if-no-files-found: error
